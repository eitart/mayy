<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>for uuuuu </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">

    <style>

      :root {
        --noche: #1b1330;
        --ciruela: #4a2459;
        --amanecer: #f3a58f;
        --crema: #fff3e6;
        --hoja: #3f8a52;
        --hoja-oscura: #2f7545;
        --tallo: #4f9a5b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {

        background: linear-gradient(180deg, var(--noche) 0%, var(--ciruela) 55%, var(--amanecer) 100%);
        font-family: "Cormorant Garamond", Georgia, serif;
      }

      .mensaje {
        position: absolute;
        top: 9vh;
        left: 50%;
        transform: translateX(-50%);
        width: min(90vw, 22ch);
        text-align: center;
        font-style: italic;
        font-weight: 500;
        font-size: clamp(1.9rem, 5.2vw, 3.6rem);
        line-height: 1.2;
        color: var(--crema);
        text-shadow: 0 2px 24px rgba(27, 19, 48, 0.7);
        z-index: 5;
      }
      .palabra {
        display: inline-block;
        animation: aparecer 1.4s ease both;
        animation-delay: calc(4.4s + var(--i) * 0.3s);
      }

      @keyframes aparecer {
        from {
          opacity: 0;
          filter: blur(6px);
          transform: translateY(10px);
        }
      }

      .jardin {
        position: absolute;
        inset: 0;
        z-index: 2;
      }

      .suelo {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 9vh;
        background: linear-gradient(180deg, #2b3a2e 0%, #1a1f1c 100%);
        z-index: 3;
      }

      .tulipan {
        position: absolute;
        bottom: 6vh;
        width: calc(var(--s) * 1vmin);
        transform: translateX(-50%);
        filter: brightness(var(--br, 1));
      }

      .tulipan svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
        transform-origin: 50% 100%;
        animation: crecer 2.4s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        animation-delay: var(--d);
      }

      @keyframes crecer {
        from {
          transform: scaleY(0);
        }
      }

      .balanceo {
        transform-origin: 50px 260px;
        transform-box: view-box;
        animation: balancear var(--v) ease-in-out infinite alternate;
        animation-delay: var(--d);
      }

      @keyframes balancear {
        from {
          transform: rotate(-2.2deg);
        }
        to {
          transform: rotate(2.2deg);
        }
      }

      .tallo {
        fill: none;
        stroke: var(--tallo);
        stroke-width: 5;
        stroke-linecap: round;
      }

      .hoja {
        fill: var(--hoja);
      }

      .hoja + .hoja {
        fill: var(--hoja-oscura);
      }

      .flor {
        transform-origin: 50px 112px;
        transform-box: view-box;
        animation: abrir-flor 1.8s ease-out backwards;
        animation-delay: calc(var(--d) + 1.6s);
      }

      @keyframes abrir-flor {
        from {
          transform: scale(0.55);
        }
      }

      .petalo {
        transform-origin: 50px 112px;
        transform-box: view-box;
      }

      .petalo-izq {
        fill: var(--c2);
        transform: rotate(-11deg);
        animation: abrir-izq 1.8s ease-out backwards;
        animation-delay: calc(var(--d) + 1.6s);
      }

      .petalo-der {
        fill: var(--c2);
        transform: rotate(11deg);
        animation: abrir-der 1.8s ease-out backwards;
        animation-delay: calc(var(--d) + 1.6s);
      }

      .petalo-frente {
        fill: var(--c1);
      }

      @keyframes abrir-izq {
        from {
          transform: rotate(7deg);
        }
      }

      @keyframes abrir-der {
        from {
          transform: rotate(-7deg);
        }
      }

      /* Pequeño reflejo de luz sobre el pétalo frontal */
      .brillo {
        fill: none;
        stroke: #ffffff;
        stroke-opacity: 0.35;
        stroke-width: 3;
        stroke-linecap: round;
      }

      /* ============ 5. PARTÍCULAS ============ */
      .luz {
        position: absolute;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #ffe9a8;
        box-shadow: 0 0 10px 3px rgba(255, 233, 168, 0.7);
        z-index: 4;
        animation: flotar var(--t) ease-in-out infinite alternate;
      }

      @keyframes flotar {
        from {
          transform: translate(0, 0);
          opacity: 0.2;
        }
        to {
          transform: translate(var(--dx), var(--dy));
          opacity: 1;
        }
      }

      .petalo-caido {
        position: absolute;
        top: 0;
        width: 12px;
        height: 16px;
        border-radius: 80% 0 80% 80%;
        opacity: 0.85;
        z-index: 4;
        animation: caer var(--t) linear infinite;
        animation-delay: var(--r);
      }

      @keyframes caer {
        from {
          transform: translate3d(0, -12vh, 0) rotate(0deg);
        }
        to {
          transform: translate3d(var(--dx), 112vh, 0) rotate(540deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
        }
        .petalo-caido,
        .luz {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <h1 class="mensaje" id="mensaje">
      Por las flores que no pude darte en tu cumple May
    </h1>

    <div class="jardin" id="jardin"></div>
    <div class="suelo"></div>

    <template id="plantilla-tulipan">
      <div class="tulipan">
        <svg viewBox="0 0 100 260" aria-hidden="true">
          <g class="balanceo">

            <path class="tallo" d="M50 112 C50 160 46 210 50 260" />

            <path class="hoja" d="M50 232 C20 222 12 182 18 152 C38 167 50 197 50 232 Z" />
            <path class="hoja" d="M50 216 C80 206 90 171 84 141 C64 156 50 181 50 216 Z" />

            <g class="flor">
              <path class="petalo petalo-izq" d="M50 112 C30 112 20 90 24 58 C26 46 30 40 34 36 C40 50 48 62 50 72 Z" />
              <path class="petalo petalo-der" d="M50 112 C70 112 80 90 76 58 C74 46 70 40 66 36 C60 50 52 62 50 72 Z" />
              <path class="petalo petalo-frente" d="M50 114 C34 108 32 80 38 56 C42 44 46 38 50 30 C54 38 58 44 62 56 C68 80 66 108 50 114 Z" />
              <path class="brillo" d="M44 96 C41 80 42 62 48 46" />
            </g>
          </g>
        </svg>
      </div>
    </template>

    <script>

      const tulipanes = [
        { x: 8,  s: 13, c1: "#f27ea9", c2: "#d95a8c", d: 0.6, br: 0.8 },
        { x: 22, s: 17, c1: "#f7c948", c2: "#e0a92b", d: 0.2, br: 1 },
        { x: 36, s: 14, c1: "#9b5de5", c2: "#7a3fc4", d: 1.0, br: 0.85 },
        { x: 50, s: 19, c1: "#e63e5c", c2: "#bf2745", d: 0,   br: 1 },
        { x: 64, s: 14, c1: "#fbeee6", c2: "#e6cdbd", d: 0.8, br: 0.85 },
        { x: 78, s: 17, c1: "#f28a3c", c2: "#d96d1f", d: 0.4, br: 1 },
        { x: 92, s: 13, c1: "#ff6fb5", c2: "#d94f96", d: 1.2, br: 0.8 }
      ];

      const jardin = document.getElementById("jardin");
      const plantilla = document.getElementById("plantilla-tulipan");

      tulipanes.forEach((t) => {
        const copia = plantilla.content.firstElementChild.cloneNode(true);
        copia.style.left = t.x + "%";
        copia.style.setProperty("--s", t.s);
        copia.style.setProperty("--c1", t.c1);
        copia.style.setProperty("--c2", t.c2);
        copia.style.setProperty("--d", t.d + "s");
        copia.style.setProperty("--br", t.br);
        copia.style.setProperty("--v", (3.5 + Math.random() * 2).toFixed(1) + "s");

        copia.style.zIndex = Math.round(t.s);
        jardin.appendChild(copia);
      });


      const mensaje = document.getElementById("mensaje");
      const palabras = mensaje.textContent.trim().split(/\s+/);
      mensaje.textContent = "";
      palabras.forEach((palabra, i) => {
        const span = document.createElement("span");
        span.className = "palabra";
        span.style.setProperty("--i", i);
        span.textContent = palabra;
        mensaje.appendChild(span);
        mensaje.appendChild(document.createTextNode(" "));
      });

      for (let i = 0; i < 16; i++) {
        const luz = document.createElement("div");
        luz.className = "luz";
        luz.style.left = Math.random() * 100 + "%";
        luz.style.top = 35 + Math.random() * 50 + "%";
        luz.style.setProperty("--t", (3 + Math.random() * 4).toFixed(1) + "s");
        luz.style.setProperty("--dx", (Math.random() * 60 - 30).toFixed(0) + "px");
        luz.style.setProperty("--dy", (Math.random() * 60 - 30).toFixed(0) + "px");
        jardin.appendChild(luz);
      }

      const colores = ["#f27ea9", "#e63e5c", "#f7c948", "#ff6fb5", "#fbeee6"];
      for (let i = 0; i < 12; i++) {
        const petalo = document.createElement("div");
        petalo.className = "petalo-caido";
        petalo.style.left = Math.random() * 100 + "%";
        petalo.style.background = colores[i % colores.length];
        petalo.style.setProperty("--t", (9 + Math.random() * 6).toFixed(1) + "s");
        petalo.style.setProperty("--r", (4 + Math.random() * 10).toFixed(1) + "s");
        petalo.style.setProperty("--dx", (Math.random() * 160 - 80).toFixed(0) + "px");
        jardin.appendChild(petalo);
      }
    </script>
  </body>
</html>
